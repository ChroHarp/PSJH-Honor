<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平興數枝扭蛋機</title>
    <meta name="description" content="平興國中數理資優班 錢天堂風傳統柑仔店 溫暖水彩 3D 扭蛋抽籤機">
    <link rel="stylesheet" href="gacha-style.css">
</head>
<body>

<header class="top-bar wood-box">
    <div class="brand-wrap">
        <div class="brand-badge" aria-hidden="true">🏮</div>
        <div>
            <h1 class="brand-title">平興數枝扭蛋機</h1>
        </div>
    </div>

    <div class="nav-actions">
        <button type="button" class="px-btn" id="btn-sound" title="切換 8-bit 音效">🔊 音效：開</button>
    </div>
</header>

<main class="main-grid">
    <!-- 左側：錢天堂風柑仔店 溫暖水彩 3D 微縮舞台 -->
    <section class="diorama-panel pixel-box" aria-label="錢天堂風柑仔店 溫暖水彩 3D 扭蛋機舞台">
        <div class="diorama-viewport">
            <canvas id="gacha-canvas" title="點擊扭蛋機也可以直接抽籤！"></canvas>
            <div class="hd2d-lighting"></div>
            <div class="sunburst" id="sunburst"></div>
            <div class="stage-status-pill" id="stage-status">READY • 剩餘 0 人</div>

            <!-- 保留原本的撕紙邊緣抽獎券樣式 -->
            <div class="result-reveal" id="result-reveal" role="dialog" aria-labelledby="result-title">
                <button type="button" class="btn-close-ticket" id="btn-close-result" title="關閉獎券">✕</button>
                <h2 id="result-title">🎉 中獎名單 🎉</h2>
                <div class="names-window" id="names-window">
                    <div class="drawn-names" id="drawn-names"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 右側：控制面板與抽籤紀錄 -->
    <aside class="control-column">
        <section class="panel-section pixel-box">
            <h2 class="section-heading">
                <span>🎛️ 抽籤設定</span>
                <span id="roster-source-tag" style="font-size: 0.78rem; color: var(--ink-muted);">名單人數: 0</span>
            </h2>

            <div class="group-toolbar">
                <button type="button" class="px-mini-btn" id="btn-select-all">全選組別</button>
                <button type="button" class="px-mini-btn" id="btn-select-none">取消全選</button>
            </div>

            <div class="checkbox-group" id="group-checkboxes"></div>
            <div class="group-roster-panel" id="group-roster-panel" hidden></div>

            <div class="draw-row">
                <label for="draw-count" style="font-family: var(--font-pixel); font-size: 1rem;">抽出人數</label>
                <div class="stepper">
                    <button type="button" id="btn-minus" aria-label="減少人數">-</button>
                    <input type="number" id="draw-count" value="1" min="1" max="30">
                    <button type="button" id="btn-plus" aria-label="增加人數">+</button>
                </div>
            </div>

            <label class="repeat-toggle">
                <input type="checkbox" id="allow-repeat">
                <span>本次可重複抽籤</span>
            </label>

            <div class="action-buttons">
                <button type="button" class="px-btn px-btn-primary" id="btn-draw">🎲 開始抽籤</button>
                <button type="button" class="px-btn px-btn-danger" id="btn-clear">🗑️ 清除紀錄</button>
            </div>
        </section>

        <section class="panel-section pixel-box">
            <h2 class="section-heading">
                <span>📜 抽籤紀錄</span>
                <span id="remaining-count" style="font-size: 0.9rem; color: var(--gacha-green-dark);">剩餘: 0</span>
            </h2>
            <div class="history-list" id="history-list">
                <div class="history-empty">尚未抽出任何學生</div>
            </div>
        </section>
    </aside>
</main>

<script src="roster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="gacha-scene.js"></script>
<script>
    (function () {
        const rosterInfo = window.getActiveGachaRoster();
        const students = rosterInfo.students;
        const groups = new Set(students.map(s => s.group));
        let isAnimating = false;
        let historyEntries = [];
        let nextHistoryId = 1;
        let activeInspectGroup = null;

        // 啟動 錢天堂風柑仔店 溫暖水彩 3D 場景
        const scene = new window.GachaScene('gacha-canvas');

        document.getElementById('roster-source-tag').textContent = `名單人數: ${students.length} 人`;

        // 初始化組別勾選與展開名單按鈕
        const checkboxContainer = document.getElementById('group-checkboxes');
        const groupRosterPanel = document.getElementById('group-roster-panel');

        Array.from(groups).sort().forEach(group => {
            const chip = document.createElement('div');
            chip.className = 'group-chip';
            chip.dataset.group = group;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = group;
            checkbox.checked = true;
            checkbox.title = `勾選是否納入「${group}」進行抽籤`;
            checkbox.setAttribute('aria-label', `勾選 ${group}`);
            checkbox.addEventListener('change', updateRemainingCount);

            const expandBtn = document.createElement('button');
            expandBtn.type = 'button';
            expandBtn.className = 'group-expand-btn';
            expandBtn.textContent = `${group} ▾`;
            expandBtn.title = `展開「${group}」名單以手動切換已抽／未抽`;
            expandBtn.addEventListener('click', () => {
                activeInspectGroup = activeInspectGroup === group ? null : group;
                renderGroupRoster();
            });

            chip.appendChild(checkbox);
            chip.appendChild(expandBtn);
            checkboxContainer.appendChild(chip);
        });

        function renderGroupRoster() {
            document.querySelectorAll('#group-checkboxes .group-chip').forEach(chip => {
                const isThis = chip.dataset.group === activeInspectGroup;
                chip.classList.toggle('inspecting', isThis);
                const btn = chip.querySelector('.group-expand-btn');
                if (btn) btn.textContent = `${chip.dataset.group} ${isThis ? '▴' : '▾'}`;
            });

            if (!activeInspectGroup) {
                groupRosterPanel.hidden = true;
                groupRosterPanel.innerHTML = '';
                return;
            }

            const groupStudents = students.filter(s => s.group === activeInspectGroup);
            groupRosterPanel.hidden = false;
            groupRosterPanel.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'roster-panel-header';

            const title = document.createElement('span');
            title.textContent = `📋 ${activeInspectGroup} 名單（點擊切換已抽／未抽）`;

            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'roster-close-btn';
            closeBtn.textContent = '✕';
            closeBtn.title = '收合名單';
            closeBtn.addEventListener('click', () => {
                activeInspectGroup = null;
                renderGroupRoster();
            });

            header.appendChild(title);
            header.appendChild(closeBtn);
            groupRosterPanel.appendChild(header);

            const listWrap = document.createElement('div');
            listWrap.className = 'student-pill-list';

            groupStudents.forEach(s => {
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = `student-pill${s.drawn ? ' is-excluded' : ''}`;
                pill.textContent = `${s.seatNum}號 ${s.name}`;
                pill.title = s.drawn ? '已在抽籤紀錄中，點擊移出並恢復抽籤' : '點擊加入抽籤紀錄';
                pill.addEventListener('click', () => {
                    if (isAnimating) return;
                    if (!s.drawn) {
                        s.drawn = true;
                        if (!historyEntries.some(e => e.student === s)) {
                            historyEntries.unshift({ id: nextHistoryId++, student: s });
                        }
                    } else {
                        s.drawn = false;
                        historyEntries = historyEntries.filter(e => e.student !== s);
                    }
                    renderHistory();
                    renderGroupRoster();
                    updateRemainingCount();
                });
                listWrap.appendChild(pill);
            });

            groupRosterPanel.appendChild(listWrap);
        }

        function getAvailableStudents() {
            const selectedGroups = Array.from(
                document.querySelectorAll('#group-checkboxes input:checked')
            ).map(cb => cb.value);
            const allowRepeat = document.getElementById('allow-repeat').checked;
            if (allowRepeat) {
                return students.filter(s => selectedGroups.includes(s.group));
            }
            return students.filter(s => selectedGroups.includes(s.group) && !s.drawn);
        }

        function updateRemainingCount() {
            const available = getAvailableStudents().length;
            const allowRepeat = document.getElementById('allow-repeat').checked;
            const countLabel = allowRepeat ? `可抽: ${available} 人（可重複）` : `剩餘: ${available} 人`;
            const stageLabel = allowRepeat ? `READY • 可抽 ${available} 人（可重複）` : `READY • 剩餘 ${available} 人`;
            document.getElementById('remaining-count').textContent = countLabel;
            if (!isAnimating) {
                document.getElementById('stage-status').textContent = stageLabel;
            }
        }

        function drawLots() {
            if (isAnimating) return;

            const drawInput = document.getElementById('draw-count');
            const countInput = parseInt(drawInput.value, 10);
            if (isNaN(countInput) || countInput < 1) {
                alert('請輸入有效的抽出人數！');
                return;
            }

            const allowRepeat = document.getElementById('allow-repeat').checked;
            const availableStudents = getAvailableStudents();
            if (availableStudents.length === 0) {
                alert(
                    allowRepeat
                        ? '請至少勾選一個包含學生的分組！'
                        : '目前選擇的分組已經沒有未抽出的學生了！請勾選其他組別或清除紀錄。'
                );
                return;
            }

            const drawCount = Math.min(countInput, availableStudents.length);
            if (countInput > availableStudents.length) {
                alert(`注意：所選分組僅剩 ${availableStudents.length} 人，將全數抽出。`);
            }

            // Fisher-Yates 洗牌演算法
            const pool = [...availableStudents];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            const winners = pool.slice(0, drawCount);

            winners.forEach(w => {
                const target = students.find(
                    s => s.name === w.name && s.group === w.group && s.classNum === w.classNum && s.seatNum === w.seatNum
                );
                if (target) target.drawn = true;
            });

            startDrawSequence(winners);
        }

        function startDrawSequence(winners) {
            isAnimating = true;
            document.getElementById('btn-draw').disabled = true;
            document.getElementById('result-reveal').classList.remove('show');
            document.getElementById('sunburst').style.display = 'none';
            document.getElementById('stage-status').textContent = 'DRAWING...';

            const namesContainer = document.getElementById('drawn-names');
            namesContainer.style.animation = 'none';
            namesContainer.style.transform = 'translateY(0)';

            scene.triggerDraw(() => {
                document.getElementById('sunburst').style.display = 'block';

                namesContainer.innerHTML = winners.map(w =>
                    `<div>${w.group} - ${w.classNum}班 ${w.seatNum}號 <br> <span style="font-size: 1.75rem;">${w.name}</span></div>`
                ).join('<hr style="border-top: 2px dashed #3a2214; margin: 10px 0;">');

                document.getElementById('result-reveal').classList.add('show');

                setTimeout(() => {
                    const windowEl = document.getElementById('names-window');
                    const overage = namesContainer.scrollHeight - windowEl.clientHeight;
                    if (overage > 4) {
                        namesContainer.style.setProperty('--scroll-dist', `-${overage}px`);
                        const duration = Math.max(3, overage / 28);
                        namesContainer.style.animation = `pingPongScroll ${duration}s ease-in-out 1s infinite alternate`;
                    }
                }, 480);

                addToHistory(winners);
                isAnimating = false;
                document.getElementById('btn-draw').disabled = false;
                updateRemainingCount();
            });
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            if (historyEntries.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'history-empty';
                emptyDiv.textContent = '尚未抽出任何學生';
                historyList.appendChild(emptyDiv);
                return;
            }

            historyEntries.forEach(entry => {
                const s = entry.student;
                const item = document.createElement('div');
                item.className = 'history-item';

                const tag = document.createElement('span');
                tag.className = 'h-tag';
                tag.textContent = s.group;
                item.appendChild(tag);

                const nameSpan = document.createElement('span');
                nameSpan.textContent = s.name;
                item.appendChild(nameSpan);

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'h-remove-btn';
                removeBtn.textContent = '✕';
                removeBtn.title = `將 ${s.name} 移出紀錄並恢復可抽籤`;
                removeBtn.setAttribute('aria-label', `將 ${s.name} 移出紀錄`);
                removeBtn.addEventListener('click', () => {
                    if (isAnimating) return;
                    historyEntries = historyEntries.filter(e => e.id !== entry.id);
                    if (!historyEntries.some(e => e.student === s)) {
                        s.drawn = false;
                    }
                    renderHistory();
                    renderGroupRoster();
                    updateRemainingCount();
                });
                item.appendChild(removeBtn);

                historyList.appendChild(item);
            });
        }

        function addToHistory(winners) {
            const allowRepeat = document.getElementById('allow-repeat').checked;
            winners.forEach(w => {
                const target = students.find(
                    s => s.name === w.name && s.group === w.group && s.classNum === w.classNum && s.seatNum === w.seatNum
                ) || w;
                if (allowRepeat || !historyEntries.some(e => e.student === target)) {
                    historyEntries.unshift({ id: nextHistoryId++, student: target });
                }
            });
            renderHistory();
            renderGroupRoster();
        }

        function clearHistory() {
            if (isAnimating) return;
            if (confirm('確定要清除所有抽籤紀錄嗎？這將重置所有學生的抽籤狀態。')) {
                students.forEach(s => { s.drawn = false; });
                historyEntries = [];
                renderHistory();
                renderGroupRoster();
                document.getElementById('result-reveal').classList.remove('show');
                document.getElementById('sunburst').style.display = 'none';
                document.getElementById('drawn-names').style.animation = 'none';
                updateRemainingCount();
            }
        }

        document.getElementById('allow-repeat').addEventListener('change', updateRemainingCount);

        document.getElementById('btn-draw').addEventListener('click', drawLots);
        document.getElementById('gacha-canvas').addEventListener('click', drawLots);
        document.getElementById('btn-clear').addEventListener('click', clearHistory);
        document.getElementById('btn-close-result').addEventListener('click', () => {
            document.getElementById('result-reveal').classList.remove('show');
            document.getElementById('sunburst').style.display = 'none';
        });

        document.getElementById('btn-select-all').addEventListener('click', () => {
            document.querySelectorAll('#group-checkboxes input').forEach(cb => { cb.checked = true; });
            updateRemainingCount();
        });
        document.getElementById('btn-select-none').addEventListener('click', () => {
            document.querySelectorAll('#group-checkboxes input').forEach(cb => { cb.checked = false; });
            updateRemainingCount();
        });

        const drawCountEl = document.getElementById('draw-count');
        document.getElementById('btn-minus').addEventListener('click', () => {
            const v = parseInt(drawCountEl.value, 10) || 1;
            if (v > 1) drawCountEl.value = v - 1;
        });
        document.getElementById('btn-plus').addEventListener('click', () => {
            const v = parseInt(drawCountEl.value, 10) || 1;
            if (v < 30) drawCountEl.value = v + 1;
        });

        const btnSound = document.getElementById('btn-sound');
        btnSound.addEventListener('click', () => {
            scene.audio.muted = !scene.audio.muted;
            btnSound.textContent = scene.audio.muted ? '🔇 音效：關' : '🔊 音效：開';
        });

        updateRemainingCount();
    })();
</script>

</body>
</html>
